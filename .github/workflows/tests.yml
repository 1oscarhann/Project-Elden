name: tests

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot-builds/releases/download"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip "${url}/${GODOT_VERSION}-stable/${file}.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/"${file}"
          ln -sf ~/godot/"${file}" ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run GUT suite
        run: |
          ~/godot/godot --headless --path . \
            -s addons/gut/gut_cmdln.gd -gdir=res://test/unit -gexit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import check
        env:
          DATABASE_URL: "postgresql://unused"
          JWT_SECRET: "ci-only-secret-that-is-long-enough-to-pass-validation"
        run: python -c "import main; print('ok', len(main.app.routes), 'routes')"
